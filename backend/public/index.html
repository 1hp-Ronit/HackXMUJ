<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PulseNet Rescue Command Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>PULSENET RESCUE COMMAND CENTER</h1>
    <div class="status">
      <span id="connection-dot" class="dot"></span>
      <span id="connection-label">Connecting…</span>
      <span id="message-count-label">0 msgs</span>
    </div>
  </header>

  <main class="layout">
    <section class="map-panel">
      <div id="map"></div>
    </section>

    <aside class="sidebar">
      <div class="card stats-card">
        <h2>Statistics</h2>
        <div class="stat-row"><span>Total Messages</span><strong id="stat-total">0</strong></div>
        <div class="stat-row"><span>Active SOS</span><strong id="stat-sos" class="sos-value">0</strong></div>
        <div class="stat-row"><span>Nodes Seen</span><strong id="stat-nodes">0</strong></div>
      </div>

      <div class="card sos-feed-card">
        <h2>Live SOS Feed</h2>
        <ul id="sos-feed"></ul>
      </div>
    </aside>
  </main>

  <footer class="ticker-wrap">
    <div id="ticker" class="ticker"></div>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.heat/0.2.0/leaflet-heat.js"></script>
  <script src="app.js"></script>
</body>
</html>
